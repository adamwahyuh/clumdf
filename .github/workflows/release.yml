name: Release

# Push tag versi, mis.: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # membuat Release & mengunggah installer

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Gagal cepat bila tag bukan vX.Y.Z, sebelum build 3 OS dimulai
      - run: node scripts/set-version.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: ./scripts/fetch-pdfium.sh
      - run: cargo test -p pdf-core
        env:
          PDFIUM_DIR: src-tauri/pdfium

  release:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Pasang library sistem (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Versi app dari tag
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"
        shell: bash
      - run: npm ci
      # libpdfium & data bahasa OCR ikut dibundel sebagai resource
      - run: ./scripts/fetch-pdfium.sh && ./scripts/fetch-tessdata.sh
        shell: bash
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Clumdf ${{ github.ref_name }}
          releaseBody: |
            Unduh installer sesuai sistem operasi:
            - **macOS** (Intel & Apple Silicon): `.dmg`
            - **Windows**: `.exe` (disarankan) atau `.msi`
            - **Linux**: `.AppImage`, `.deb` (Ubuntu/Debian), atau `.rpm` (Fedora)

            Fitur OCR butuh Tesseract terpasang di komputer (petunjuknya ada di layar OCR).
          releaseDraft: false
          prerelease: false
          # Clumdf_1.0.0.dmg, Clumdf_1.0.0.exe, Clumdf_1.0.0.AppImage, ...
          releaseAssetNamePattern: "[name]_[version][ext]"

  # Setelah rilis berhasil, versi di repo ikut diperbarui otomatis:
  # cukup push tag, tidak perlu mengubah VERSION di lokal.
  update-version:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: node scripts/set-version.mjs "$GITHUB_REF_NAME"
      - name: Commit versi baru ke branch utama
        run: |
          if git diff --quiet; then
            echo "Versi di repo sudah ${GITHUB_REF_NAME}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: versi ${GITHUB_REF_NAME}"
          git push
