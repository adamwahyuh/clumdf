name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: ./scripts/fetch-pdfium.sh
      # pdf-core tidak bergantung pada Tauri, jadi tidak perlu library sistem webview;
      # PDFIUM_DIR membuat tes render benar-benar dijalankan, bukan dilewati
      - run: cargo test -p pdf-core
        env:
          PDFIUM_DIR: src-tauri/pdfium

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Pasang library sistem (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # libpdfium ikut dibundel sebagai resource (bundle.resources di tauri.conf.json)
      - run: ./scripts/fetch-pdfium.sh
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: berkas-${{ matrix.platform }}
          path: |
            target/release/bundle/
            target/*/release/bundle/
          if-no-files-found: error
